version: "3.8"
services:
  mcp-gateway:
    build: .
    container_name: openmausbot-mcp-gateway
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=8318
      - HOST=127.0.0.1
      # Browser-reachable origin for Google OAuth redirect_uri (dashboard Connect).
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://127.0.0.1:8318}
      - AUTH_DIR=/root/.mcp-gateway/auth
      # Required: stable bearer shared with Nibble MCP headers.
      - GATEWAY_INTERNAL_KEY=${GATEWAY_INTERNAL_KEY:?set GATEWAY_INTERNAL_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ~/.mcp-gateway/auth:/root/.mcp-gateway/auth
