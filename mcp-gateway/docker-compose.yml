version: "3.8"
services:
  mcp-gateway:
    build: .
    container_name: openmausbot-mcp-gateway
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=8318
      - HOST=127.0.0.1
      - AUTH_DIR=/root/.mcp-gateway/auth
      # Required: stable bearer shared with OpenMausBot MCP headers.
      - GATEWAY_INTERNAL_KEY=${GATEWAY_INTERNAL_KEY:?set GATEWAY_INTERNAL_KEY}
    volumes:
      - ~/.mcp-gateway/auth:/root/.mcp-gateway/auth
