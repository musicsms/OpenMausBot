# One relay node behind Cloudflare Tunnel. Both services use the host's network: the relay listens on 127.0.0.1:8080
# only and sees cloudflared as 127.0.0.1, which forwards Cf-Connecting-IP.
name: omb-relay

services:
  relay:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must name the relay image}
    network_mode: host
    env_file: relay.env
    environment:
      RELAY_HOST: 127.0.0.1
      RELAY_PORT: "8080"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # The relay tells hosts it is restarting and exits within 5 s of SIGTERM.
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: journald
      options: { tag: omb-relay }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    network_mode: host
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    restart: unless-stopped
    depends_on: [relay]
    logging:
      driver: journald
      options: { tag: omb-relay-cloudflared }
